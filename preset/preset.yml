schema_version: "1.0"

preset:
  id: "okr-bet"
  name: "OKR Bet Spec Section"
  version: "0.1.0"
  description: "Adds a Hypothesis & Bet section to every spec and teaches /speckit.specify to fill it from an okr:<team>/H-n bet. Companion of the okr extension."
  author: "juanl"
  repository: "https://github.com/juanl/spec-kit-okr"
  license: "MIT"

requires:
  speckit_version: ">=0.9.0"

provides:
  templates:
    - type: "template"
      name: "spec-template"
      file: "templates/spec-bet-section.md"
      description: "Hypothesis & Bet section appended to the spec template"
      strategy: "append"
    - type: "command"
      name: "speckit.specify"
      file: "commands/speckit.specify.okr.md"
      description: "Fill the Hypothesis & Bet section from the okr extension's bet file"
      strategy: "append"

tags:
  - "okr"
  - "hypothesis"
