# OKR Bets — configuration
# Copy to .specify/extensions/okr/okr-config.yml and customize.
# Local overrides: .specify/extensions/okr/okr-config.local.yml (gitignored).
# Every key is optional.

period: ""                    # e.g. "2027-Q1"; empty → derived from today's date and `horizon`
horizon: "quarter"            # quarter | half | year
team: ""                      # your team id, e.g. "reporting"

levels:
  company:                    # always read-only: context for where the team's work impacts
    source: "file"            # file: an imported copy · mcp: read from your OKR tool, mirrored locally
    path: ".specify/okr/company/{period}.md"
    stale_days: 30            # warn when a file import is older than this
    mcp:
      server: ""              # MCP server name as configured in your agent (e.g. "okr-tool")
      tools:
        read: ""              # the only operation used at the company level
  team:
    source: "file"
    path: ".specify/okr/teams/{team}/{period}.md"
    agent_writes: "confirm"   # show the exact change and wait for a yes
    cadence_days: 14
    mcp:
      server: ""
      tools: { read: "", update_kr: "", add_checkin: "", propose: "" }

key_results:
  min: 2                      # per objective
  max: 4

scoring:
  aspirational_target: 0.7
  thresholds:
    persevere: 0.7
    iterate: 0.4

initiatives:
  require_leading_signal: true   # validation stories always need one; this extends it to scale stories

interview:
  max_questions: 8            # primary questions; mode=lite uses 3
  follow_ups_per_question: 1  # do not count toward the cap

output:
  artifact_language: "auto"   # body text language; headings, IDs and statuses stay in English
