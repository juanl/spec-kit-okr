schema_version: "1.0"

extension:
  id: okr
  name: "OKR Bets"
  version: "0.2.0"
  description: "Treat every spec as a bet on a team Key Result: a hypothesis and a verification contract (every number the verdict needs, and whether it can be read today) before /speckit.specify, measurement planned into the plan, and a verdict after launch that gates scaling. Company OKRs are read-only context (repo or MCP); team OKRs stay living"
  category: "process"
  effect: "read-write"
  author: "juanl"
  repository: "https://github.com/juanl/spec-kit-okr"
  license: MIT

requires:
  speckit_version: ">=0.9.0"
  commands:
    - "speckit.specify"

provides:
  commands:
    - name: speckit.okr.set
      file: commands/speckit.okr.set.md
      description: "Create or update the team OKR set for a period, with ladder checks to company KRs; import a read-only copy of the company OKRs"
    - name: speckit.okr.frame
      file: commands/speckit.okr.frame.md
      description: "Frame a feature as a bet: the team KR it should move, the hypothesis, how it would be refuted, the verification contract, guardrails, candidate ideas"
    - name: speckit.okr.align
      file: commands/speckit.okr.align.md
      description: "Check that the spec tests its bet: validation slice as P1, scale stories gated, guardrails covered; frames the bet post-hoc if needed"
    - name: speckit.okr.measure
      file: commands/speckit.okr.measure.md
      description: "Make the bet readable on launch day: turn the verification contract into capture, instrumentation, baselines, attribution, calendar — fed into plan.md"
    - name: speckit.okr.review
      file: commands/speckit.okr.review.md
      description: "Bet review after launch: score KRs, read signals and guardrails, verdict on the hypothesis that gates the scale stories"
    - name: speckit.okr.checkin
      file: commands/speckit.okr.checkin.md
      description: "Team check-in: roll up bet verdicts, update KR statuses, note the impact on company KRs, flag orphaned work, close a period"
    - name: speckit.okr.status
      file: commands/speckit.okr.status.md
      description: "Read-only OKR tree: company → team KRs → hypotheses → specs, with statuses, staleness, and orphans"

  templates:
    - name: company-okrs-template
      file: templates/company-okrs-template.md
      description: "Read-only copy of the company OKRs for a period"
    - name: team-okrs-template
      file: templates/team-okrs-template.md
      description: "Team OKR set for a period, with hypotheses and check-ins"
    - name: bet-template
      file: templates/bet-template.md
      description: "One bet (hypothesis) tested by one or more specs"
    - name: measurement-plan-template
      file: templates/measurement-plan-template.md
      description: "Measurement plan for a bet"

  config:
    - name: "okr-config.yml"
      template: "okr-config.template.yml"
      description: "Team, period, OKR sources per level (file or MCP), write policies, Key Result rules, scoring"
      required: false

hooks:
  before_specify:
    command: speckit.okr.frame
    optional: true
    prompt: "Before writing the spec: which team KR should this move, what result would prove the idea wrong, and can we read that result today? (OKR bet framing, ~7 questions; mode=lite for 3)"
    description: "Frame the feature as a bet on a team Key Result so the spec is written as the initiative that tests it"
  after_specify:
    command: speckit.okr.align
    optional: true
    prompt: "Check that the spec can actually test its bet (P1 = validation slice, scale stories gated)? No bet yet? It frames one from the spec."
    description: "Align the spec with its bet, or frame the bet post-hoc"
  after_plan:
    command: speckit.okr.measure
    optional: true
    prompt: "Make the bet readable on launch day: add instrumentation, baselines, attribution, and a check-in calendar to the plan?"
    description: "Plan measurement so /speckit.tasks generates it before the validation slice ships"

tags:
  - "okr"
  - "product"
  - "metrics"
  - "impact"
  - "hypothesis"
  - "experimentation"
  - "workflow"
